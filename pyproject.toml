[tool.pytest.ini_options]
testpaths = ["topics"]

[tool.ruff]
target-version = "py314"
line-length = 88
# These scripts are meant to crash, so they break lint on purpose.
extend-exclude = ["topics/00-reading-errors"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style (PEP 8)
    "F",       # pyflakes: real bugs, e.g. unused imports, undefined names
    "I",       # isort: import ordering
    "N",       # pep8-naming: snake_case functions, PascalCase classes
    "B",       # bugbear: common gotchas, e.g. mutable default arguments
    "UP",      # pyupgrade: use modern syntax for your Python version
    "SIM",     # simplify: "this if/else could be one line"
    "C4",      # comprehensions: better list/dict comprehensions
    "PTH",     # use pathlib instead of os.path
    "RET",     # cleaner return statements
    "RUF",     # ruff's own extra checks
]